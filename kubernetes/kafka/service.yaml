apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: client
      protocol: TCP
      port: 29092
      targetPort: 29092
    - name: controller
      protocol: TCP
      port: 9093
      targetPort: 9093